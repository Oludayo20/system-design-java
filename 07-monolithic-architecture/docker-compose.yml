services:
  postgres:
    image: postgres:16-alpine
    container_name: blogstack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blogstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blogstack_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-blogstack}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-blogstack} -d ${POSTGRES_DB:-blogstack}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blogstack-api
    environment:
      PORT: 3007
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-blogstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blogstack_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-blogstack}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_please}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - '3007:3007'
    depends_on:
      postgres:
        condition: service_healthy
    # Flyway runs automatically on boot (spring.flyway.enabled=true), so no separate
    # migrate-then-start command is needed like the Node version had.

volumes:
  postgres_data:
